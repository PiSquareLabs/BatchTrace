      ## Context
      **Goal:** Find every place a failed batch touched the hospital: stock on the shelf and doses given, tiered by confidence.

      | Owner | Milestone · due (IST) | Priority | Critical path | Order |
      |---|---|---|---|---|
      | @safar-byte (B: Intelligence) | M2 · Core pipelines · 2026-09-30 | P0 | **yes** | step 14 of 39 · B's 3 of 9 |

      **You need before starting:**
      - `CORE.NSQ_ALERT` from #12
      - CORE hospital tables from #9

      ## Tasks
      Match `CORE.NSQ_ALERT` against `stock_batches` and `dispensing` in four tiers:
      - [ ] **1.** **exact:** normalized batch equal + `JAROWINKLER_SIMILARITY(manufacturer) ≥ 85` + expiry within ±1 month
      - [ ] **2.** **probable:** normalized batch equal but weak manufacturer match, OR `EDITDISTANCE(batch) = 1` with the same composition and maker
      - [ ] **3.** **watchlist:** same product and maker, different batch → no patient action
      - [ ] **4.** **blank batch:** a patient got the same product and maker during the alert batch's validity window, but no batch was recorded → "possible exposure".

      Store `match_tier, match_score, reasons (array)`.

      **Deliverables (commit / create these):**
      - [ ] `snowflake/21_matching_dt.sql`
      - [ ] Dynamic Table `CORE.BATCH_MATCHES(match_tier, match_score, reasons, …)`

