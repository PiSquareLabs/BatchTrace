    body: |-
      ## Context
      **Owner:** Person B (B: Intelligence) · **Milestone:** M2 · Core pipelines · **Priority:** P0

      Part of **Kavach** — see `CLAUDE_CODE_TEAM_PLAN.md` §8 (plan item #17). Principles: Snowflake-first, everything as code under `snowflake/`, cite `source_file + page`, "needs clinician review" wording, protect the credits.

      ## Tasks
      Match `CORE.NSQ_ALERT` against `stock_batches` and `dispensing` in three tiers:
      - [ ] **exact:** normalized batch equal + `JAROWINKLER_SIMILARITY(manufacturer) ≥ 85` + expiry within ±1 month
      - [ ] **probable:** normalized batch equal but weak manufacturer match, OR `EDITDISTANCE(batch) = 1` with the same composition and maker
      - [ ] **watchlist:** same product and maker, different batch → no patient action
      - [ ] **blank batch:** a patient got the same product and maker during the alert batch's validity window, but no batch was recorded → "possible exposure".

      Store `match_tier, match_score, reasons (array)`.

      ## Snowflake features
      - Dynamic Tables
      - JAROWINKLER_SIMILARITY / EDITDISTANCE

      ## CoCo CLI
      _Optional — log any notable CoCo session in `docs/coco_log.md`._

      ## Acceptance criteria
      - [ ] The Dynamic Table refreshes on new alerts; decoys never land in exact or probable.

      ## Depends on
      - #9
      - #12
